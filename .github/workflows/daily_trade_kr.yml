name: daily-trade-kr

on:
  schedule:
    # 백업 시계: 주 시계는 외부(cron-job.org, 17번 문서) workflow_dispatch. GitHub cron은 3슬롯 백업(비정각).
    # KRX 개장 후 09:12 / 09:42 / 10:12 KST, 평일. 멱등 가드로 1회만 집행 (패치 13 B)
    - cron: "12 0 * * 1-5"
    - cron: "42 0 * * 1-5"
    - cron: "12 1 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-trade-kr
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # 트리거 시점 SHA 가 아니라 '실행 시점 최신 브랜치'를 받는다 — 대기열에서 기다린 런이 실집행 마커 이전
          # 커밋을 읽어 같은 날 재집행하는 경로 차단 (2026-09-28 리뷰 지적 3)
          ref: ${{ github.ref_name }}

      - name: 멱등 가드 (오늘 이미 실제 집행했으면 이후 단계 전부 스킵 — 이중 집행 차단)
        id: idem
        run: |
          TODAY=$(TZ=Asia/Seoul date +%F)
          LAST=$(cat signals/last_executed_kr.txt 2>/dev/null || echo none)
          if [ "$LAST" = "$TODAY" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "오늘($TODAY) 실집행 마커 존재 — 중복 집행 방지 스킵 (외부 시계·백업 cron·워치독 중복 발화)"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "마지막 실집행 $LAST ≠ 오늘 $TODAY — 집행 진행"
          fi

      - uses: actions/setup-python@v5
        if: steps.idem.outputs.skip != 'true'
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt
        if: steps.idem.outputs.skip != 'true'

      - name: KR 목표비중 산출 (K조합+VT)
        if: steps.idem.outputs.skip != 'true'
        run: python pipeline/signals_kr.py

      - name: 사전 비행검사 (계층 1 — 실패 시 집행 차단)
        if: steps.idem.outputs.skip != 'true'
        run: python pipeline/preflight.py kr

      - name: KIS 모의계좌 집행
        if: steps.idem.outputs.skip != 'true'
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_ACCOUNT: ${{ secrets.KIS_ACCOUNT }}
        run: python pipeline/execute_kr.py

      - name: 사후 대사 (계층 3 — 조용한 실패 봉쇄 + KR 현금 음수 검사, 결함 H)
        # always(): preflight 정지일에도 예수금 음수·실보유 4조 감시는 계속 (리뷰 지적 2·6)
        if: always() && steps.idem.outputs.skip != 'true'
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_ACCOUNT: ${{ secrets.KIS_ACCOUNT }}
        run: python pipeline/reconcile.py kr

      - name: 로그 커밋
        if: always() && steps.idem.outputs.skip != 'true'
        run: |
          # 결함 O (2026-09-28): 옛 코드는 `git pull --rebase ... || true` 로 실패를 숨겼고 push 실패 시
          # 실집행 마커가 저장소에 남지 않아 다음 발화가 재집행할 수 있었다(9/3 실증 계열).
          # 커밋 → (pull --rebase → push) 3회 재시도 → 최종 실패 시 워크플로 실패(메일 경보).
          git config user.name "quant-kr-bot"
          git config user.email "actions@github.com"
          git add signals reports
          git diff --cached --quiet && echo "변경 없음" && exit 0
          git commit -m "kr-trade: $(date -u +%F) 집행 로그"
          for i in 1 2 3; do
            if git pull --rebase --autostash && git push; then echo "push 성공 (${i}회차)"; exit 0; fi
            echo "push 실패 (${i}회차) — 재시도"; git rebase --abort 2>/dev/null || true; sleep $((i*10))
          done
          echo "::error::로그·실집행 마커 push 3회 실패 — 저장소에 마커가 없으면 다음 발화가 재집행할 수 있음(결함 O). 즉시 확인"
          exit 1
