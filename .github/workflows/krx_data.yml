name: krx-data

on:
  schedule:
    # KRX 장 마감(15:30 KST) 이후 — UTC 08:00 = KST 17:00, 평일
    - cron: "0 8 * * 1-5"
  workflow_dispatch: {}   # 수동 실행 (최초 백필용)

permissions:
  contents: write

concurrency:
  group: krx-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: KRX 일봉 수집 (백필/증분 자동)
        run: python pipeline/fetch_krx.py

      - name: 신호 사전점검 (조기 경보 — 집행 16시간 전 이상 감지)
        run: |
          python pipeline/signals_kr.py
          python pipeline/preflight.py kr

      - name: 커밋 & 푸시
        if: always()
        run: |
          git config user.name "quant-krx-bot"
          git config user.email "actions@github.com"
          git pull --rebase || true
          git add data
          git diff --cached --quiet && echo "변경 없음" && exit 0
          git commit -m "krx: $(date -u +%F) 자동 수집"
          git push
