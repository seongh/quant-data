name: daily-trade

on:
  schedule:
    # 백업 시계: 주 시계는 외부(cron-job.org, 17번 문서) workflow_dispatch. GitHub cron은 4슬롯 백업(비정각, 아래 설명).
    # 미국 장 개장(09:30 ET) 후. 서머타임 종료(2026-11-01 일) 후에는 13:43·14:13 UTC 가 08:43·09:13 EST 로
    # 개장 전이 되어 장시간 가드가 전부 SKIP 한다 → 백업 시계가 통째로 무력화되는 문제를 미리 봉합(2026-09-28).
    # 4슬롯: 여름 09:43·10:13·10:43·11:13 EDT / 겨울 (SKIP)·(SKIP)·09:43·10:13 EST. 멱등 가드로 하루 1회만 집행,
    # 개장 전 SKIP 로그는 하루 1회만 적재(H′-5 패치).
    - cron: "43 13 * * 1-5"
    - cron: "13 14 * * 1-5"
    - cron: "43 14 * * 1-5"
    - cron: "13 15 * * 1-5"
  workflow_dispatch: {}   # 수동 실행 (테스트용)

permissions:
  contents: write

concurrency:
  group: daily-trade
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: 멱등 가드 (오늘 이미 실제 집행했으면 이후 단계 전부 스킵 — 이중 집행 차단)
        id: idem
        run: |
          TODAY=$(TZ=America/New_York date +%F)
          LAST=$(cat signals/last_executed_us.txt 2>/dev/null || echo none)
          if [ "$LAST" = "$TODAY" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "오늘($TODAY) 실집행 마커 존재 — 중복 집행 방지 스킵 (외부 시계·백업 cron·워치독 중복 발화)"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "마지막 실집행 $LAST ≠ 오늘 $TODAY — 집행 진행"
          fi

      - uses: actions/setup-python@v5
        if: steps.idem.outputs.skip != 'true'
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt
        if: steps.idem.outputs.skip != 'true'

      - name: F1 시스템 목표비중 산출
        if: steps.idem.outputs.skip != 'true'
        run: python pipeline/signals.py

      - name: 사전 비행검사 (계층 1 — 실패 시 집행 차단)
        if: steps.idem.outputs.skip != 'true'
        run: python pipeline/preflight.py us

      - name: 모의계좌 집행 (위원회 결정 우선, 없으면 시스템 신호)
        if: steps.idem.outputs.skip != 'true'
        env:
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
          DECISION_URL: ${{ vars.DECISION_URL }}
        run: python pipeline/execute.py

      - name: 사후 대사 (계층 3 — 조용한 실패 봉쇄)
        if: steps.idem.outputs.skip != 'true'
        env:
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
        run: python pipeline/reconcile.py us

      - name: 그림자 포트폴리오 기록 (거래 없음 — 실패해도 집행 무영향)
        if: steps.idem.outputs.skip != 'true'
        continue-on-error: true
        run: python pipeline/shadow.py

      - name: 로그 커밋
        if: always() && steps.idem.outputs.skip != 'true'
        run: |
          # 결함 O (2026-09-28): 옛 코드는 `git pull --rebase ... || true` 로 실패를 숨겼고 push 실패 시
          # 실집행 마커가 저장소에 남지 않아 다음 발화가 재집행할 수 있었다(9/3 실증 계열).
          # 커밋 → (pull --rebase → push) 3회 재시도 → 최종 실패 시 워크플로 실패(메일 경보).
          git config user.name "quant-trade-bot"
          git config user.email "actions@github.com"
          git add signals reports
          git diff --cached --quiet && echo "변경 없음" && exit 0
          git commit -m "trade: $(date -u +%F) 집행 로그"
          for i in 1 2 3; do
            if git pull --rebase --autostash && git push; then echo "push 성공 (${i}회차)"; exit 0; fi
            echo "push 실패 (${i}회차) — 재시도"; git rebase --abort 2>/dev/null || true; sleep $((i*10))
          done
          echo "::error::로그·실집행 마커 push 3회 실패 — 저장소에 마커가 없으면 다음 발화가 재집행할 수 있음(결함 O). 즉시 확인"
          exit 1
